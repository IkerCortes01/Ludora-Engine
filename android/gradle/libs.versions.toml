# Catalogo de versiones.
#
# Todas las versiones de dependencias viven AQUI y no repartidas por los
# build.gradle.kts. Asi subir una version se hace en un sitio y no en cinco.
#
# La lista es corta a proposito: Compose, DataStore y BiometricPrompt. No hay
# inyeccion de dependencias, ni libreria de red, ni base de datos: hoy no hay
# servidor al que llamar y los datos caben en archivos.

[versions]
agp = "8.7.3"
kotlin = "2.0.21"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
datastore = "1.1.1"
biometric = "1.2.0-alpha05"
fragment = "1.8.5"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# El BOM fija de golpe las versiones de TODAS las piezas de Compose, que tienen
# que ir coordinadas entre si. Por eso las de abajo no llevan version.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# BiometricPrompt: el dialogo del sistema para huella y cara. Es la UNICA via
# legitima; ninguna app recibe los datos biometricos en si (ver Biometria.kt).
androidx-biometric = { group = "androidx.biometric", name = "biometric-ktx", version.ref = "biometric" }

# MainActivity hereda de FragmentActivity (lo exige BiometricPrompt). Llega de
# rebote con biometric-ktx, pero se declara aparte a proposito: depender de una
# dependencia transitiva se rompe el dia que la de arriba cambie la suya.
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
