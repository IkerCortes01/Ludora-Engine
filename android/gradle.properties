# Ajustes de Gradle para el proyecto.

# 2 GB le bastan a este proyecto; subirlo solo gasta RAM del equipo.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Compilar en paralelo y reusar resultados entre compilaciones.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX en vez de las librerias de soporte antiguas. Obligatorio hoy.
android.useAndroidX=true

# Codigo de estilo oficial de Kotlin.
kotlin.code.style=official

# Solo se generan los BuildConfig/R que de verdad se usan.
android.nonTransitiveRClass=true
